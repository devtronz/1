<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond of Love - Rakhi Celebration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="diya-icon">🪔</span>
                    <h1>Bond of Love</h1>
                </div>
                <button class="menu-btn">☰</button>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-image-wrapper">
                <img src="https://via.placeholder.com/400x500/e8d4c4/000000?text=Siblings+Bonding" alt="Siblings celebrating Rakhi" class="hero-image">
                <div class="clouds-top"></div>
                <div class="clouds-bottom"></div>
            </div>
        </section>

        <!-- Offer Badge Section -->
        <section class="offer-section">
            <div class="offer-badge">
                <div class="badge-header">
                    <span class="crescent-moon">🌙</span>
                    <span class="rakhi-text">Rakhi Discount</span>
                </div>
                <div class="badge-offer">Offer 20%</div>
                <button class="cta-button">Shop Bestsellers</button>
            </div>
        </section>

        <!-- Footer Spacing -->
        <div class="footer-spacing"></div>
    </div>
</body>
</html>
